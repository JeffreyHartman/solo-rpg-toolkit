<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon map</title>
<style>
  :root {
    --fog: #0e0b08;
    --ink: #e8dcc2;
    --ink-dim: #9a8b72;
    --panel: rgba(22, 17, 12, 0.92);
    --edge: #3a2f22;
    --accent: #c9a25e;
  }
  html, body { margin: 0; height: 100%; background: var(--fog); color: var(--ink);
    font: 14px/1.4 Georgia, "Iowan Old Style", "Palatino Linotype", serif; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    cursor: grab; touch-action: none; }
  canvas#view.dragging { cursor: grabbing; }
  .bar { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; gap: 8px;
    align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .title { font-variant: small-caps; letter-spacing: 0.08em; font-size: 17px; color: var(--accent);
    text-shadow: 0 1px 2px #000; margin-right: auto; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .status { position: fixed; left: 16px; bottom: 10px; color: var(--ink-dim); font-size: 12px;
    text-shadow: 0 1px 2px #000; }
  #test { position: fixed; top: 52px; right: 16px; bottom: 36px; width: 210px; overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px;
    display: none; }
  #test h2 { font-size: 13px; margin: 8px 0 4px; color: var(--accent); font-weight: normal;
    font-variant: small-caps; letter-spacing: 0.06em; }
  #test h2:first-child { margin-top: 0; }
  #test .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 6px; }
  #test label { font-size: 12px; white-space: nowrap; cursor: pointer; }
  #test label.file { color: var(--accent); }
  #test .note { font-size: 11px; color: var(--ink-dim); margin: 8px 0 0; }
  @media (max-width: 520px) { #test { width: auto; left: 16px; top: auto; height: 40vh; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="bar">
  <div class="title" id="title">Dungeon map</div>
  <button id="fit" title="Zoom to what has been revealed">Fit</button>
  <button id="sheet" title="Show the whole sheet">Sheet</button>
</div>
<div id="test"></div>
<div class="status" id="status">loading...</div>

<script src="areas.js"></script>
<script>
(() => {
  const D = window.AREAS;
  if (!D) {
    document.getElementById('status').textContent =
      'No map installed. See "The player\'s map" in this campaign\'s README.md.';
    return;
  }
  const POLL_MS = 3000;
  // Written by the campaign's reveal command; either an array of ids or {group: [ids]}.
  const REVEAL_SRC = '../state/revealed.js';
  const TEST = new URLSearchParams(location.search).has('test');
  const byId = new Map(D.areas.map(a => [String(a.id), a]));
  if (D.map.title) { document.title = D.map.title; document.getElementById('title').textContent = D.map.title; }

  const view = document.getElementById('view');
  const ctx = view.getContext('2d');
  const statusEl = document.getElementById('status');

  // Offscreen canvas at map resolution holding only the revealed pixels.
  const rc = document.createElement('canvas');
  rc.width = D.map.w; rc.height = D.map.h;
  const rctx = rc.getContext('2d');

  function loadImg(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('failed to load ' + src));
      im.src = src;
    });
  }

  let mapImg = null;
  const maskImg = new Map();
  const patchImg = [];
  let fileIds = new Set();
  let testIds = new Set();
  let lastFileKey = null;
  let lastUpdate = null;

  // Fog texture drawn once to a small tile; putImageData on our own canvas is untainted.
  const fogTile = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const t = c.getContext('2d'); const id = t.createImageData(160, 160);
    for (let i = 0; i < id.data.length; i += 4) {
      const n = Math.random() * 14;
      id.data[i] = 14 + n; id.data[i + 1] = 11 + n * 0.8; id.data[i + 2] = 8 + n * 0.6; id.data[i + 3] = 255;
    }
    t.putImageData(id, 0, 0);
    return ctx.createPattern(c, 'repeat');
  })();

  // view transform: screen = map * scale + (tx, ty)
  let scale = 0.5, tx = 0, ty = 0;
  const dpr = () => window.devicePixelRatio || 1;

  function resize() {
    view.width = Math.round(innerWidth * dpr());
    view.height = Math.round(innerHeight * dpr());
    draw();
  }

  function revealedIds() {
    const s = new Set(fileIds);
    testIds.forEach(i => s.add(i));
    return [...s].filter(i => byId.has(i));
  }

  function rebuild() {
    if (!mapImg) return;
    const ids = revealedIds();
    rctx.save();
    rctx.clearRect(0, 0, rc.width, rc.height);
    rctx.globalCompositeOperation = 'source-over';
    rctx.filter = 'blur(2px)';
    for (const id of ids) {
      const a = byId.get(id), im = maskImg.get(id);
      if (im) rctx.drawImage(im, a.bbox[0], a.bbox[1]);
    }
    rctx.filter = 'none';
    rctx.globalCompositeOperation = 'source-in';
    rctx.drawImage(mapImg, 0, 0);
    rctx.globalCompositeOperation = 'source-atop';
    const on = new Set(ids);
    D.patches.forEach((p, i) => { if (on.has(p.owner) && patchImg[i]) rctx.drawImage(patchImg[i], p.x, p.y); });
    rctx.fillStyle = 'rgba(196, 164, 112, 0.30)';
    rctx.fillRect(0, 0, rc.width, rc.height);
    rctx.restore();
    draw();
    showStatus();
  }

  function showStatus() {
    const n = revealedIds().length;
    const t = lastUpdate ? lastUpdate.toLocaleTimeString() : 'never';
    statusEl.textContent = `${n} area${n === 1 ? '' : 's'} revealed · reveal file read ${t}` +
      (TEST ? ' · test mode' : '');
  }

  function draw() {
    const r = dpr();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = fogTile;
    ctx.fillRect(0, 0, view.width, view.height);
    ctx.setTransform(scale * r, 0, 0, scale * r, tx * r, ty * r);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(rc, 0, 0);
    // vignette in screen space
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createRadialGradient(view.width / 2, view.height / 2, Math.min(view.width, view.height) * 0.35,
      view.width / 2, view.height / 2, Math.max(view.width, view.height) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, view.width, view.height);
  }

  function fitBox(x, y, w, h, maxScale) {
    const pad = 60, W = innerWidth, H = innerHeight - 40;
    scale = Math.min((W - pad * 2) / w, (H - pad * 2) / h, maxScale);
    tx = W / 2 - (x + w / 2) * scale;
    ty = 40 + H / 2 - (y + h / 2) * scale;
    draw();
  }
  function fitSheet() { fitBox(0, 0, D.map.w, D.map.h, 4); }
  function fitRevealed() {
    const ids = revealedIds();
    if (!ids.length) return fitSheet();
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const id of ids) {
      const b = byId.get(id).bbox;
      x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]);
      x1 = Math.max(x1, b[0] + b[2]); y1 = Math.max(y1, b[1] + b[3]);
    }
    fitBox(x0, y0, x1 - x0, y1 - y0, 1.6);
  }

  // Pan and zoom
  let drag = null;
  view.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    view.setPointerCapture(e.pointerId); view.classList.add('dragging');
  });
  view.addEventListener('pointermove', e => {
    if (!drag) return;
    tx = drag.tx + e.clientX - drag.x; ty = drag.ty + e.clientY - drag.y; draw();
  });
  const endDrag = () => { drag = null; view.classList.remove('dragging'); };
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  view.addEventListener('wheel', e => {
    e.preventDefault();
    const k = Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015));
    const ns = Math.min(6, Math.max(0.08, scale * k));
    tx = e.clientX - (e.clientX - tx) * (ns / scale);
    ty = e.clientY - (e.clientY - ty) * (ns / scale);
    scale = ns; draw();
  }, { passive: false });
  view.addEventListener('dblclick', fitRevealed);
  document.getElementById('fit').onclick = fitRevealed;
  document.getElementById('sheet').onclick = fitSheet;
  addEventListener('resize', resize);

  // revealed.js polling: a fresh <script> tag per poll works from file:// with no server.
  function parseRevealed(v) {
    const s = new Set();
    const add = x => { if (x !== null && x !== undefined) s.add(String(x)); };
    if (Array.isArray(v)) v.forEach(add);
    else if (v && typeof v === 'object') Object.values(v).forEach(list => (Array.isArray(list) ? list : [list]).forEach(add));
    return s;
  }
  let firstLoad = true;
  function poll() {
    const el = document.createElement('script');
    el.src = REVEAL_SRC + '?t=' + Date.now();
    el.onload = () => {
      el.remove();
      lastUpdate = new Date();
      const next = parseRevealed(window.REVEALED);
      const key = [...next].sort().join(',');
      if (key !== lastFileKey) {
        lastFileKey = key; fileIds = next; syncTestPanel(); rebuild();
        if (firstLoad) fitRevealed();
      } else {
        showStatus();
      }
      firstLoad = false;
    };
    el.onerror = () => {
      el.remove();
      statusEl.textContent = 'could not read ' + REVEAL_SRC + '; showing last known state';
      if (firstLoad) { firstLoad = false; rebuild(); fitRevealed(); }
    };
    document.head.appendChild(el);
  }

  // Test mode: id checkboxes only, no geometry.
  const testEl = document.getElementById('test');
  function buildTestPanel() {
    if (!TEST) return;
    testEl.style.display = 'block';
    const groups = [['Rooms', 'room'], ['Corridors', 'corridor'], ['Secret doors', 'secret']];
    let html = '';
    for (const [title, kind] of groups) {
      html += `<h2>${title}</h2><div class="grid">`;
      for (const a of D.areas.filter(a => a.kind === kind)) {
        html += `<label data-id="${a.id}"><input type="checkbox" value="${a.id}"> ${a.id}</label>`;
      }
      html += '</div>';
    }
    html += '<p class="note">Gold ids come from the reveal file. Ticks here are local to this tab.</p>' +
      '<p><button id="clearTest">Clear ticks</button></p>';
    testEl.innerHTML = html;
    testEl.addEventListener('change', e => {
      const cb = e.target; if (cb.type !== 'checkbox') return;
      if (cb.checked) testIds.add(cb.value); else testIds.delete(cb.value);
      rebuild();
    });
    document.getElementById('clearTest').onclick = () => { testIds.clear(); syncTestPanel(); rebuild(); };
  }
  function syncTestPanel() {
    if (!TEST) return;
    testEl.querySelectorAll('label').forEach(l => {
      const id = l.dataset.id, cb = l.firstElementChild, inFile = fileIds.has(id);
      l.classList.toggle('file', inFile);
      cb.disabled = inFile;
      cb.checked = inFile || testIds.has(id);
    });
  }

  async function start() {
    resize();
    buildTestPanel();
    try {
      mapImg = await loadImg(D.map.src);
      await Promise.all(D.areas.map(a => loadImg(a.mask).then(im => maskImg.set(String(a.id), im))));
      await Promise.all(D.patches.map((p, i) => loadImg(p.src).then(im => { patchImg[i] = im; })));
    } catch (err) {
      statusEl.textContent = String(err.message || err);
    }
    poll();
    setInterval(poll, POLL_MS);
  }
  start();
})();
</script>
</body>
</html>
