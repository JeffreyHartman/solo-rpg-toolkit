[project]
name = "solo-roll"
version = "0.1.0"
description = "Deterministic dice, table lookup, and Mythic chart math for the Solo RPG GM Assistant toolkit"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
solo-roll = "solo_roll.cli:main"
solo-campaign = "solo_roll.campaign:main"
solo-harness = "solo_roll.harness.cli:main"
solo-flextale-import = "solo_roll.flextale_import:main"

[project.optional-dependencies]
dev = ["pytest>=7", "httpx2>=2"]
harness = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "claude-agent-sdk==0.2.189"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solo_roll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
